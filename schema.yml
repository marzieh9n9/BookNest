openapi: 3.0.3
info:
  title: BookNest API
  version: 1.0.0
  description: Bookstore API for books, categories, users, orders, and inventory management.
paths:
  /api/addresses/:
    get:
      operationId: addresses_list
      summary: List my saved addresses
      tags:
      - addresses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAddress'
          description: ''
    post:
      operationId: addresses_create
      summary: Create a saved address
      tags:
      - addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAddress'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserAddress'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserAddress'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAddress'
          description: ''
        '400':
          description: Invalid address data.
  /api/addresses/{id}/:
    get:
      operationId: addresses_retrieve
      summary: Retrieve a saved address
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - addresses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAddress'
          description: ''
        '404':
          description: Address not found.
    patch:
      operationId: addresses_partial_update
      summary: Update a saved address
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserAddress'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserAddress'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserAddress'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAddress'
          description: ''
        '400':
          description: Invalid address data.
        '404':
          description: Address not found.
    delete:
      operationId: addresses_destroy
      summary: Delete a saved address
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - addresses
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Address deleted.
        '404':
          description: Address not found.
  /api/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailLogin'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Access and refresh tokens returned.
  /api/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: A generic response is returned whether or not the email belongs
            to an account.
  /api/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Password changed successfully.
  /api/auth/password-reset/verify/:
    post:
      operationId: auth_password_reset_verify_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetVerify'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Returns a short-lived reset token after successful code verification.
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          description: Account created successfully.
  /api/books/:
    get:
      operationId: books_retrieve
      description: Returns a paginated list of books. Supports search and filtering.
      summary: List books
      parameters:
      - in: query
        name: category
        schema:
          type: integer
        description: Filter by category ID.
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -price
          - -stock
          - -title
          - price
          - stock
          - title
        description: Sort the book list.
      - in: query
        name: page
        schema:
          type: integer
        description: Page number.
      - in: query
        name: price
        schema:
          type: number
        description: Filter by exact book price.
      - in: query
        name: search
        schema:
          type: string
        description: Search by book title or author.
      - in: query
        name: stock
        schema:
          type: integer
        description: Filter by exact stock quantity.
      tags:
      - books
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookPagination'
          description: ''
    post:
      operationId: books_create
      description: Creates a new book. Admin access is required.
      summary: Create a book
      tags:
      - books
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Book'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Book'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Book'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
          description: ''
        '400':
          description: Invalid book data.
        '403':
          description: Admin permission required.
  /api/books/{id}/:
    get:
      operationId: books_retrieve_2
      summary: Retrieve a book
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - books
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
          description: ''
        '404':
          description: Book not found.
    put:
      operationId: books_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - books
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: books_partial_update
      summary: Partially update a book
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - books
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBook'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBook'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBook'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
          description: ''
        '400':
          description: Invalid book data.
        '403':
          description: Admin permission required.
    delete:
      operationId: books_destroy
      summary: Delete a book
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - books
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Book deleted successfully.
        '403':
          description: Admin permission required.
        '404':
          description: Book not found.
  /api/cart/:
    get:
      operationId: cart_retrieve
      description: Returns the authenticated user's shopping cart.
      summary: Retrieve shopping cart
      tags:
      - cart
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    delete:
      operationId: cart_destroy
      summary: Clear shopping cart
      tags:
      - cart
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Shopping cart cleared.
  /api/cart/items/:
    post:
      operationId: cart_items_create
      summary: Add a book to cart
      tags:
      - cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddCartItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddCartItem'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
        '400':
          description: Invalid quantity or insufficient stock.
  /api/cart/items/{id}/:
    patch:
      operationId: cart_items_partial_update
      summary: Update cart item quantity
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItem'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
        '400':
          description: Invalid quantity or insufficient stock.
        '404':
          description: Cart item not found.
    delete:
      operationId: cart_items_destroy
      summary: Remove an item from cart
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - cart
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Cart item removed.
        '404':
          description: Cart item not found.
  /api/checkout/:
    post:
      operationId: checkout_create
      description: Creates an order from the authenticated user's cart. Validates
        current stock and calculates prices on the server. The cart is cleared after
        successful order creation. Payment remains unpaid until the demo payment endpoint
        is used.
      summary: Checkout shopping cart
      tags:
      - checkout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Checkout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Checkout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Checkout'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '400':
          description: Cart is empty or stock is insufficient.
        '401':
          description: Authentication required.
  /api/orders/:
    get:
      operationId: orders_list
      description: Customers can see only their own orders. Staff users can see all
        orders.
      summary: List my orders
      tags:
      - orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
          description: ''
  /api/orders/{id}/:
    get:
      operationId: orders_retrieve
      description: Customers can retrieve only their own orders. Staff users can retrieve
        all orders.
      summary: Retrieve an order
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '404':
          description: Order not found.
  /api/orders/{id}/cancel/:
    post:
      operationId: orders_cancel_create
      description: Cancels a pending order and restores the reserved book quantities
        to stock.
      summary: Cancel an order
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '400':
          description: Only pending orders can be cancelled.
        '404':
          description: Order not found.
  /api/orders/{id}/simulate-payment/:
    post:
      operationId: orders_simulate_payment_create
      description: Marks an eligible pending order as paid for demonstration purposes
        only. No real money is charged.
      summary: Simulate order payment
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoPaymentResponse'
          description: ''
        '400':
          description: Order cannot be paid.
        '404':
          description: Order not found.
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - ht
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/token/:
    post:
      operationId: token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/token/refresh/:
    post:
      operationId: token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
components:
  schemas:
    AddCartItem:
      type: object
      properties:
        book_id:
          type: integer
        quantity:
          type: integer
          maximum: 100
          minimum: 1
      required:
      - book_id
      - quantity
    Book:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        author:
          type: string
          maxLength: 200
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        stock:
          type: integer
          maximum: 2147483647
          minimum: 0
        category:
          type: integer
          nullable: true
      required:
      - author
      - id
      - price
      - stock
      - title
    BookPagination:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/Book'
      required:
      - count
      - next
      - previous
      - results
    Cart:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        total_price:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - items
      - total_price
      - updated_at
    CartBook:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        author:
          type: string
          maxLength: 200
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        stock:
          type: integer
          maximum: 2147483647
          minimum: 0
        category:
          type: integer
          nullable: true
      required:
      - author
      - id
      - price
      - stock
      - title
    CartItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        book:
          allOf:
          - $ref: '#/components/schemas/CartBook'
          readOnly: true
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 1
        line_total:
          type: string
          readOnly: true
      required:
      - book
      - id
      - line_total
      - quantity
    Checkout:
      type: object
      properties:
        recipient_first_name:
          type: string
          maxLength: 100
        recipient_last_name:
          type: string
          maxLength: 100
        phone_number:
          type: string
          maxLength: 20
          pattern: ^\+?[0-9][0-9\s()-]{7,18}$
        city:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        shipping_address:
          type: string
          maxLength: 1000
      required:
      - city
      - phone_number
      - postal_code
      - recipient_first_name
      - recipient_last_name
      - shipping_address
    DemoPaymentResponse:
      type: object
      properties:
        order_id:
          type: integer
        payment_status:
          type: string
        order_status:
          type: string
        paid_at:
          type: string
          format: date-time
        detail:
          type: string
      required:
      - detail
      - order_id
      - order_status
      - paid_at
      - payment_status
    EmailLogin:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        payment_status:
          allOf:
          - $ref: '#/components/schemas/PaymentStatusEnum'
          readOnly: true
        paid_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        recipient_first_name:
          type: string
          readOnly: true
        recipient_last_name:
          type: string
          readOnly: true
        phone_number:
          type: string
          readOnly: true
        city:
          type: string
          readOnly: true
        postal_code:
          type: string
          readOnly: true
        shipping_address:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        total_price:
          type: string
          readOnly: true
      required:
      - city
      - created_at
      - id
      - items
      - paid_at
      - payment_status
